name: ❓ Question & Support
description: Ask a question about using or developing on Velorio Labs software
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're here to help!
  - type: input
    id: title
    attributes:
      label: Topic
      placeholder: e.g. How to configure custom STUN/TURN server for LocalDrop?
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question Details
      description: Describe what you are trying to accomplish and what you've tried so far.
    validations:
      required: true
